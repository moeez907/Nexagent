name: NexAgent CI/CD - Deploy to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy on AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            echo "🚀 Starting Deployment on EC2..."

            # Navigate to project directory
            APP_DIR="/home/${{ secrets.EC2_USER }}/web_agent"
            if [ ! -d "$APP_DIR" ]; then
              echo "Error: Directory $APP_DIR does not exist. Please run initial setup."
              exit 1
            fi

            cd "$APP_DIR"

            # Pull latest changes from main branch
            echo "📥 Pulling latest code..."
            git reset --hard
            git pull origin main

            # Ensure .env has the required secrets
            echo "⚙️ Updating environment secrets..."
            if [ -f .env ]; then
              # Update or append NEBIUS_API_KEY
              sed -i '/^NEBIUS_API_KEY=/d' .env
              echo "NEBIUS_API_KEY=${{ secrets.NEBIUS_API_KEY }}" >> .env
            else
              cp .env.example .env
              sed -i '/^NEBIUS_API_KEY=/d' .env
              echo "NEBIUS_API_KEY=${{ secrets.NEBIUS_API_KEY }}" >> .env
            fi

            # Ensure frontend serves on standard HTTP port 80
            if ! grep -q "^FRONTEND_PORT=" .env; then
              echo "FRONTEND_PORT=80" >> .env
            fi

            # Rebuild and restart Docker containers
            echo "🐳 Building and restarting Docker containers..."
            docker compose down --remove-orphans || true
            docker compose up -d --build

            # Clean unused images to save disk space
            docker image prune -f

            echo "✅ Deployment completed successfully!"
